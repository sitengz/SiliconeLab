# Full-size reference from PDMS_Elastomer/simulations/02_linear_40_high_xlink/bulk/model.conf
system = elastomer
output_dir = ../../runs/elastomer-n40-full

# Production simulation: short-linear high-crosslinker-loading reference, bulk
strand_topology = linear
strand_length = 40
strand_count = 3000
strand_functionality = 2

# Common crosslinker and stoichiometry controls
crosslinker_length = 32
functionality = 4
stoichiometry = 1:1

# Optional components disabled
moderator_count = 0

# Common preparation and conversion
density = 0.05
target_density = 0.8
target_conversion = 95

crosslink_distribution = random
crosslink_seed = 20260722
seed = 5489
